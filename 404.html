<head>

<meta name="robots" content="noindex">
<meta name="theme-color" content="#D9440F">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="application-name" content="Sir X English">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sir X English">

<link rel="stylesheet" href="/assets/css/base.css">
<style>
  .nf{min-height:100dvh;display:grid;place-items:center;background:var(--ember);color:var(--bone-2);position:relative;overflow:hidden;isolation:isolate;padding:40px var(--gut)}
  .nf::before{content:"";position:absolute;inset:0;background:var(--grain);opacity:.22;mix-blend-mode:multiply;z-index:-1}
  .nf::after{content:"";position:absolute;width:760px;height:760px;right:-200px;top:-200px;border-radius:50%;background:radial-gradient(circle,var(--ember-glow),transparent 65%);z-index:-1}
  .nf-box{display:grid;justify-items:center;gap:22px;text-align:center;max-width:520px}
  .nf-sheet{position:relative;margin-bottom:14px;width:min(320px,80vw);padding:22px 22px 26px 40px;border-radius:18px;background:#FFFDF8;color:var(--ink);text-align:left;transform:rotate(-2deg);box-shadow:0 40px 70px -30px rgba(26,20,16,.7)}
  .nf-sheet::before{content:"";position:absolute;top:0;bottom:0;left:26px;width:1.5px;background:rgba(217,68,15,.4)}
  .nf-sheet p{font-size:.95rem;line-height:1.6}
  .nf-sheet s{text-decoration:line-through wavy var(--ember);text-decoration-thickness:2px}
  .nf-sheet .note{display:block;margin-top:10px;font-family:var(--display);font-weight:700;font-size:.85rem;color:var(--ember-deep);transform:rotate(-3deg)}
  .nf-sheet .mascot{position:absolute;width:78px;height:92px;right:-22px;top:-58px;transform:rotate(12deg);filter:drop-shadow(0 10px 12px rgba(26,20,16,.35))}
  .nf h1{font-size:clamp(2rem,1.4rem + 3vw,3.2rem);font-weight:800;letter-spacing:-.04em;line-height:1}
  .nf .lede{color:rgba(255,248,240,.9)}
  .nf-btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
</style>
</head>
<body>
<main class="nf">
  <div class="nf-box">
    <div class="nf-sheet" aria-hidden="true">
      <i class="mascot"></i>
      <p>The page you wanted <s>was very very lost</s> has wandered off.</p>
      <span class="note">See me after class.</span>
    </div>
    <h1>This page isn't here</h1>
    <p class="lede">The link may be old or mistyped. Everything on the site is one tap away from the home page.</p>
    <div class="nf-btns">
      <a class="btn btn-bone" href="/">Back to the home page</a>
      <a class="btn btn-glass" href="/past-papers">Past papers</a>
    </div>
  </div>
</main>
<script src="/assets/js/main.js"></script>
<script src="/assets/js/pwa.js"></script>
</body>
</html>
