<style>
  .off{min-height:100dvh;display:grid;place-items:center;background:var(--ember);color:var(--bone-2);position:relative;overflow:hidden;isolation:isolate;padding:40px var(--gut);text-align:center}
  .off::before{content:"";position:absolute;inset:0;background:var(--grain);opacity:.22;mix-blend-mode:multiply;z-index:-1}
  .off::after{content:"";position:absolute;width:760px;height:760px;right:-200px;top:-200px;border-radius:50%;background:radial-gradient(circle,var(--ember-glow),transparent 65%);z-index:-1}
  .off-box{display:grid;justify-items:center;gap:18px;max-width:480px}
  .off .off-coin{display:block;margin:0 auto;width:110px;height:130px;filter:drop-shadow(0 16px 18px rgba(26,20,16,.35))}
  .off h1{font-size:clamp(1.9rem,1.4rem + 2.6vw,3rem);font-weight:800;letter-spacing:-.04em;line-height:1}
  .off p{color:rgba(255,248,240,.9)}
</style>
</head>
<body>
<main class="off">
  <div class="off-box">
    <span class="xcoin off-coin" aria-hidden="true"></span>
    <h1>No internet right now</h1>
    <p>Pages you've already opened still work. Reconnect and this one will load. Read, write, repeat.</p>
    <button class="btn btn-bone" type="button" onclick="location.reload()">Try again</button>
  </div>
</main>
<script src="/assets/js/main.js"></script>
